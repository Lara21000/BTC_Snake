<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Snake Bitcoin</title>
  <desc id="desc">Un serpent vert traverse une grille de jungle pour attraper un bitcoin lumineux.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07150d"/>
      <stop offset="1" stop-color="#102f1d"/>
    </linearGradient>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d2ff76"/>
      <stop offset="1" stop-color="#559d2f"/>
    </linearGradient>
    <radialGradient id="coinGlow">
      <stop stop-color="#ffd58a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f7931a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#c6ff80" stroke-opacity=".07"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="32" fill="url(#bg)"/>
  <circle cx="1020" cy="90" r="180" fill="#b9f45d" opacity=".07"/>
  <circle cx="110" cy="470" r="220" fill="#ffd54a" opacity=".05"/>
  <rect x="28" y="28" width="1144" height="464" rx="24" fill="url(#grid)" stroke="#dbff97" stroke-opacity=".18"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="78" y="120" fill="#b9f45d" font-size="18" font-weight="800" letter-spacing="5">JUNGLE ARCADE</text>
    <text x="75" y="200" fill="#f8ffe9" font-size="72" font-weight="900" letter-spacing="-4">Snake <tspan fill="#ffd54a">Bitcoin</tspan></text>
    <text x="80" y="248" fill="#b7c99c" font-size="24">Rampe. Récolte. Accélère. Bats ton record.</text>
  </g>
  <g transform="translate(100 330)">
    <rect x="0" y="0" width="86" height="86" rx="24" fill="url(#snake)"/>
    <rect x="74" y="0" width="86" height="86" rx="22" fill="url(#snake)"/>
    <rect x="148" y="0" width="86" height="86" rx="22" fill="url(#snake)"/>
    <rect x="222" y="0" width="86" height="86" rx="22" fill="url(#snake)"/>
    <rect x="296" y="0" width="86" height="86" rx="22" fill="url(#snake)"/>
    <circle cx="64" cy="27" r="6" fill="#17320f"/>
    <circle cx="64" cy="59" r="6" fill="#17320f"/>
  </g>
  <g transform="translate(910 316)">
    <circle cx="70" cy="70" r="104" fill="url(#coinGlow)" filter="url(#shadow)"/>
    <circle cx="70" cy="70" r="62" fill="#f7931a"/>
    <circle cx="70" cy="70" r="50" fill="none" stroke="#ffca79" stroke-width="4"/>
    <text x="70" y="92" text-anchor="middle" fill="#fff8e8" font-family="Arial, sans-serif" font-size="66" font-weight="700">₿</text>
  </g>
  <path d="M560 375h260" stroke="#b9f45d" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 18" opacity=".6"/>
  <path d="m810 359 24 16-24 16" fill="none" stroke="#b9f45d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
</svg>
