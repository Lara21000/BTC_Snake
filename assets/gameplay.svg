<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Boucle de jeu de Snake Bitcoin</title>
  <desc id="desc">Diriger le serpent, attraper un bitcoin, grandir et accélérer, puis battre son record.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102f1d"/><stop offset="1" stop-color="#08170e"/>
    </linearGradient>
  </defs>
  <rect width="900" height="360" rx="28" fill="#07150d"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(28 65)">
      <rect width="190" height="230" rx="22" fill="url(#card)" stroke="#b9f45d" stroke-opacity=".3"/>
      <text x="95" y="70" font-size="48">🎮</text>
      <text x="95" y="122" fill="#f8ffe9" font-size="21" font-weight="800">DIRIGE</text>
      <text x="95" y="158" fill="#b7c99c" font-size="15">Flèches, ZQSD</text>
      <text x="95" y="181" fill="#b7c99c" font-size="15">ou commandes tactiles</text>
    </g>
    <g transform="translate(249 65)">
      <rect width="190" height="230" rx="22" fill="url(#card)" stroke="#ffd54a" stroke-opacity=".35"/>
      <circle cx="95" cy="61" r="30" fill="#f7931a"/>
      <text x="95" y="73" fill="#fff8e8" font-size="34" font-weight="800">₿</text>
      <text x="95" y="122" fill="#f8ffe9" font-size="21" font-weight="800">RÉCOLTE</text>
      <text x="95" y="158" fill="#b7c99c" font-size="15">Attrape les bitcoins</text>
      <text x="95" y="181" fill="#b7c99c" font-size="15">sans toucher les murs</text>
    </g>
    <g transform="translate(470 65)">
      <rect width="190" height="230" rx="22" fill="url(#card)" stroke="#b9f45d" stroke-opacity=".3"/>
      <text x="95" y="70" font-size="48">🐍</text>
      <text x="95" y="122" fill="#f8ffe9" font-size="21" font-weight="800">ACCÉLÈRE</text>
      <text x="95" y="158" fill="#b7c99c" font-size="15">Le serpent grandit</text>
      <text x="95" y="181" fill="#b7c99c" font-size="15">et gagne en vitesse</text>
    </g>
    <g transform="translate(691 65)">
      <rect width="181" height="230" rx="22" fill="url(#card)" stroke="#ffd54a" stroke-opacity=".35"/>
      <text x="90" y="70" font-size="48">🏆</text>
      <text x="90" y="122" fill="#f8ffe9" font-size="21" font-weight="800">PROGRESSE</text>
      <text x="90" y="158" fill="#b7c99c" font-size="15">Ton meilleur score</text>
      <text x="90" y="181" fill="#b7c99c" font-size="15">reste sauvegardé</text>
    </g>
  </g>
  <g fill="none" stroke="#b9f45d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M223 180h18m-9-9 9 9-9 9"/><path d="M444 180h18m-9-9 9 9-9 9"/><path d="M665 180h18m-9-9 9 9-9 9"/>
  </g>
</svg>
