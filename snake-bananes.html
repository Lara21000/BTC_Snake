<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake Bitcoin</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8ffe9;
      --muted: #b7c99c;
      --panel: rgba(17, 40, 27, 0.88);
      --line: rgba(219, 255, 151, 0.16);
      --lime: #b9f45d;
      --lime-dark: #477729;
      --yellow: #ffd54a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      font-family: Inter, ui-rounded, "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, rgba(180, 255, 97, .15), transparent 30rem),
        radial-gradient(circle at 85% 90%, rgba(255, 213, 74, .11), transparent 28rem),
        #07150d;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    .app {
      width: min(94vw, 660px);
      padding: 24px;
      position: relative;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .eyebrow {
      color: var(--lime);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 2px 0 0;
      font-size: clamp(1.75rem, 5vw, 3rem);
      letter-spacing: -.05em;
      line-height: 1;
    }

    h1 span { color: var(--yellow); }

    .scoreboard { display: flex; gap: 8px; }

    .stat {
      min-width: 78px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      text-align: center;
      box-shadow: inset 0 1px rgba(255,255,255,.06);
    }

    .stat small {
      display: block;
      color: var(--muted);
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .stat strong { font-size: 1.25rem; font-variant-numeric: tabular-nums; }

    .board-wrap {
      position: relative;
      padding: 10px;
      border: 1px solid rgba(207, 255, 116, .21);
      border-radius: 26px;
      background: rgba(10, 27, 17, .84);
      box-shadow: 0 30px 80px rgba(0,0,0,.42), inset 0 1px rgba(255,255,255,.06);
    }

    canvas {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      border-radius: 18px;
      background: #0d2517;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 10px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: rgba(5, 16, 10, .72);
      backdrop-filter: blur(7px);
      transition: opacity .2s;
    }

    .overlay.hidden { opacity: 0; pointer-events: none; }

    .card { padding: 24px; text-align: center; }
    .mascot { font-size: 3.7rem; filter: drop-shadow(0 10px 12px rgba(0,0,0,.35)); }
    .card h2 { margin: 8px 0 6px; font-size: 2rem; letter-spacing: -.04em; }
    .card p { max-width: 360px; margin: 0 auto 20px; color: var(--muted); line-height: 1.55; }

    button {
      border: 0;
      border-radius: 999px;
      color: #14200c;
      background: var(--lime);
      font: inherit;
      font-weight: 850;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(143, 220, 70, .22);
      transition: transform .12s, filter .12s;
    }

    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    button:active { transform: translateY(1px) scale(.98); }
    #startBtn { padding: 12px 24px; }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 14px;
      color: var(--muted);
      font-size: .8rem;
    }

    kbd {
      display: inline-grid;
      min-width: 25px;
      height: 25px;
      place-items: center;
      margin: 0 1px;
      border: 1px solid var(--line);
      border-bottom-width: 3px;
      border-radius: 6px;
      color: var(--ink);
      background: rgba(255,255,255,.05);
      font: inherit;
      font-weight: 700;
    }

    .controls {
      display: none;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(2, 46px);
      justify-content: center;
      gap: 6px;
      margin-top: 16px;
    }

    .controls button { border-radius: 13px; font-size: 1.1rem; }
    .controls [data-dir="up"] { grid-column: 2; }
    .controls [data-dir="left"] { grid-column: 1; grid-row: 2; }
    .controls [data-dir="down"] { grid-column: 2; grid-row: 2; }
    .controls [data-dir="right"] { grid-column: 3; grid-row: 2; }

    @media (pointer: coarse), (max-width: 600px) {
      .controls { display: grid; }
      .footer { justify-content: center; }
      .footer .keys { display: none; }
      .app { padding: 15px; }
      header { align-items: center; }
      .stat { min-width: 64px; padding-inline: 7px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <div class="eyebrow">Jungle arcade</div>
        <h1>Snake <span>Bitcoin</span></h1>
      </div>
      <div class="scoreboard" aria-live="polite">
        <div class="stat"><small>Score</small><strong id="score">0</strong></div>
        <div class="stat"><small>Record</small><strong id="best">0</strong></div>
      </div>
    </header>

    <section class="board-wrap" aria-label="Plateau de jeu Snake">
      <canvas id="game" width="600" height="600"></canvas>
      <div class="overlay" id="overlay">
        <div class="card">
          <div class="mascot" id="mascot">🐍₿</div>
          <h2 id="message">Prêt à ramper ?</h2>
          <p id="hint">Attrape les bitcoins, grandis et évite les murs ainsi que ta propre queue.</p>
          <button id="startBtn">Commencer</button>
        </div>
      </div>
    </section>

    <div class="controls" aria-label="Commandes tactiles">
      <button data-dir="up" aria-label="Haut">▲</button>
      <button data-dir="left" aria-label="Gauche">◀</button>
      <button data-dir="down" aria-label="Bas">▼</button>
      <button data-dir="right" aria-label="Droite">▶</button>
    </div>

    <div class="footer">
      <div class="keys"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> ou <kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd></div>
      <div>Espace : pause</div>
    </div>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector('#game');
      const ctx = canvas.getContext('2d');
      const overlay = document.querySelector('#overlay');
      const startBtn = document.querySelector('#startBtn');
      const message = document.querySelector('#message');
      const hint = document.querySelector('#hint');
      const mascot = document.querySelector('#mascot');
      const scoreEl = document.querySelector('#score');
      const bestEl = document.querySelector('#best');

      const cells = 20;
      const size = canvas.width / cells;
      const directions = {
        up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
        left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
      };
      const keyMap = {
        ArrowUp: 'up', z: 'up', w: 'up',
        ArrowDown: 'down', s: 'down',
        ArrowLeft: 'left', q: 'left', a: 'left',
        ArrowRight: 'right', d: 'right'
      };

      let snake, banana, dir, nextDir, score, timer, playing = false, paused = false;
      let best = Number(localStorage.getItem('snakeBananeBest') || 0);
      bestEl.textContent = best;

      function randomBanana() {
        do {
          banana = { x: Math.floor(Math.random() * cells), y: Math.floor(Math.random() * cells) };
        } while (snake.some(part => part.x === banana.x && part.y === banana.y));
      }

      function reset() {
        snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
        dir = directions.right;
        nextDir = directions.right;
        score = 0;
        scoreEl.textContent = score;
        randomBanana();
        draw();
      }

      function start() {
        clearTimeout(timer);
        reset();
        playing = true;
        paused = false;
        overlay.classList.add('hidden');
        tick();
      }

      function speed() { return Math.max(62, 145 - score * 3); }

      function tick() {
        if (!playing || paused) return;
        dir = nextDir;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
        const hitWall = head.x < 0 || head.y < 0 || head.x >= cells || head.y >= cells;
        const hitSelf = snake.some(part => part.x === head.x && part.y === head.y);
        if (hitWall || hitSelf) return gameOver();

        snake.unshift(head);
        if (head.x === banana.x && head.y === banana.y) {
          score++;
          scoreEl.textContent = score;
          if (score > best) {
            best = score;
            bestEl.textContent = best;
            localStorage.setItem('snakeBananeBest', best);
          }
          randomBanana();
        } else {
          snake.pop();
        }
        draw();
        timer = setTimeout(tick, speed());
      }

      function gameOver() {
        playing = false;
        clearTimeout(timer);
        draw();
        mascot.textContent = '🙈₿';
        message.textContent = 'Perdu !';
        hint.textContent = `Tu as récolté ${score} bitcoin${score > 1 ? 's' : ''}. Repars pour battre ton record !`;
        startBtn.textContent = 'Rejouer';
        overlay.classList.remove('hidden');
      }

      function togglePause() {
        if (!playing) return;
        paused = !paused;
        if (paused) {
          message.textContent = 'Pause';
          hint.textContent = 'Un petit repos dans la jungle. Appuie sur Espace pour continuer.';
          mascot.textContent = '🌴🐍';
          startBtn.textContent = 'Continuer';
          overlay.classList.remove('hidden');
        } else {
          overlay.classList.add('hidden');
          tick();
        }
      }

      function chooseDirection(name) {
        if (!playing || paused) return;
        const chosen = directions[name];
        if (chosen.x + dir.x === 0 && chosen.y + dir.y === 0) return;
        nextDir = chosen;
      }

      function roundedRect(x, y, w, h, radius) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, radius);
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0d2517';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(198,255,128,.045)';
        ctx.lineWidth = 1;
        for (let i = 1; i < cells; i++) {
          ctx.beginPath(); ctx.moveTo(i * size, 0); ctx.lineTo(i * size, canvas.height); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i * size); ctx.lineTo(canvas.width, i * size); ctx.stroke();
        }

        const bx = banana.x * size + size / 2;
        const by = banana.y * size + size / 2;
        ctx.save();
        ctx.translate(bx, by);
        ctx.shadowColor = 'rgba(247,147,26,.65)';
        ctx.shadowBlur = 16;
        ctx.fillStyle = '#f7931a';
        ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#ffbd64';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(0, 0, 9.5, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = '#fff8e8';
        ctx.font = 'bold 20px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('₿', 0, 1);
        ctx.restore();

        snake.forEach((part, index) => {
          const inset = index === 0 ? 2 : 3;
          const x = part.x * size + inset;
          const y = part.y * size + inset;
          const gradient = ctx.createLinearGradient(x, y, x + size, y + size);
          gradient.addColorStop(0, index === 0 ? '#d2ff76' : '#a8e953');
          gradient.addColorStop(1, index === 0 ? '#82cf3f' : '#559d2f');
          ctx.fillStyle = gradient;
          ctx.shadowColor = index === 0 ? 'rgba(174,244,93,.35)' : 'transparent';
          ctx.shadowBlur = 10;
          roundedRect(x, y, size - inset * 2, size - inset * 2, index === 0 ? 10 : 8);
          ctx.fill();
          ctx.shadowBlur = 0;

          if (index === 0) {
            const horizontal = dir.x !== 0;
            const sign = dir.x || dir.y;
            const eyeColor = '#17320f';
            ctx.fillStyle = eyeColor;
            if (horizontal) {
              const ex = dir.x > 0 ? x + 21 : x + 5;
              ctx.beginPath(); ctx.arc(ex, y + 8, 2.3, 0, Math.PI * 2); ctx.fill();
              ctx.beginPath(); ctx.arc(ex, y + 20, 2.3, 0, Math.PI * 2); ctx.fill();
            } else {
              const ey = dir.y > 0 ? y + 21 : y + 5;
              ctx.beginPath(); ctx.arc(x + 8, ey, 2.3, 0, Math.PI * 2); ctx.fill();
              ctx.beginPath(); ctx.arc(x + 20, ey, 2.3, 0, Math.PI * 2); ctx.fill();
            }
          }
        });
      }

      document.addEventListener('keydown', event => {
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        if (keyMap[key]) {
          event.preventDefault();
          chooseDirection(keyMap[key]);
        } else if (event.code === 'Space') {
          event.preventDefault();
          togglePause();
        } else if (event.key === 'Enter' && !playing) {
          start();
        }
      });

      document.querySelectorAll('[data-dir]').forEach(button => {
        button.addEventListener('pointerdown', () => chooseDirection(button.dataset.dir));
      });

      startBtn.addEventListener('click', () => paused ? togglePause() : start());
      reset();
    })();
  </script>
</body>
</html>
